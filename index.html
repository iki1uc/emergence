<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMERGENCE · MATRYRER · GEO & PHYSIK · 540°</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --axis: #ff6b6b;
    --layer: #6b6bff;
    --field: #ffd93d;
    --respo: #6cf;
    --ghost: rgba(255,255,255,0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 4px;
    padding: 8px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 3px;
}
header h1 .geo { color: var(--axis); }
header h1 .phys { color: var(--layer); }
header h1 .field { color: var(--field); }
#info-bar { font-size: 9px; color: #666; display: flex; gap: 8px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 6px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 4px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    display: block;
}

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    max-height: 100%;
}
#panel h3 { font-size: 9px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 3px; }

#data {
    flex: 1;
    overflow-y: auto;
    font-size: 8px;
    color: #6a6a8a;
    line-height: 1.3;
    min-height: 40px;
    max-height: 100px;
    background: #06060a;
    border-radius: 4px;
    padding: 3px 5px;
}
#data .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#data .time { color: #444; }
#data .val { color: var(--gold); }
#data .axis { color: var(--axis); }
#data .layer { color: var(--layer); }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px;
    font-size: 7px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 3px 4px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 6px; text-transform: uppercase; }
.metric .value { font-size: 11px; font-weight: bold; }
.metric.axis .value { color: var(--axis); }
.metric.layer .value { color: var(--layer); }
.metric.field .value { color: var(--field); }
.metric.respo .value { color: var(--respo); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    margin-top: 3px;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 8px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.axis { border-color: var(--axis); color: var(--axis); }
button.axis:hover { background: var(--axis); color: #000; }
button.layer { border-color: var(--layer); color: var(--layer); }
button.layer:hover { background: var(--layer); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 200px; }
    #metrics { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
    <h1>
        <span class="geo">⚡ GEO</span>
        <span style="color:#666;">·</span>
        <span class="phys">⚛ PHYS</span>
        <span style="color:#666;">·</span>
        <span class="field">◈ 540°</span>
        <span style="color:#666;">·</span>
        <span style="color:var(--gold);">MATRYRER</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">φ 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="geoCanvas"></canvas>
    </div>

    <div id="panel">
        <h3>📐 GEO · PHYSIK · 540° FIELD</h3>

        <div id="metrics">
            <div class="metric axis">
                <div class="label">AXIS</div>
                <div class="value" id="axis-value">0.00</div>
            </div>
            <div class="metric layer">
                <div class="label">LAYER</div>
                <div class="value" id="layer-value">0.00</div>
            </div>
            <div class="metric field">
                <div class="label">FIELD</div>
                <div class="value" id="field-value">0°</div>
            </div>
            <div class="metric respo">
                <div class="label">RESPO</div>
                <div class="value" id="respo-value">0.00</div>
            </div>
        </div>

        <div id="data">
            <div class="entry"><span class="time">[INIT]</span> <span class="val">◈ EMERGENCE · MATRYRER</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="axis">AXIS: X, Y, Z</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="layer">LAYERS: 3, 9, 27</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="val">FIELD: 540° · φ = 1.618</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="axis" id="btn-axis">⟳ AXIS</button>
            <button class="layer" id="btn-layer">△ LAYER</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. KONSTANTEN — MATHEMATIK PUR
// ============================================================
const PHI = 1.61803398875;
const PHI_INV = 1 / PHI;
const DEG_90 = Math.PI / 2;
const DEG_120 = (2 * Math.PI) / 3;
const DEG_180 = Math.PI;
const DEG_540 = 3 * Math.PI;  // 540°

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('geoCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. STATE — GEO · PHYSIK
// ============================================================
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,

    // AXIS: X, Y, Z
    axis: { x: 0, y: 0, z: 0 },
    axisValue: 0,

    // LAYERS: 3, 9, 27
    layer: 1,
    layerValue: 0,

    // FIELD: 540°
    field: 0,
    fieldValue: 0,

    // RESPO
    respo: 0,

    // SYN & QUANT (aus NC.ARCHIEF)
    syn: 0.5,
    quant: 0.5,

    // Geometrische Punkte
    geoPoints: [],
    physPoints: []
};

// ============================================================
// 4. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('data');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'val' ? 'val' : type === 'axis' ? 'axis' : type === 'layer' ? 'layer' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 5. MATHEMATISCHE KERN-FUNKTIONEN
// ============================================================

// AXIS: X, Y, Z Rotation
function rotateAxis(angle, axis) {
    const a = angle || 0;
    const x = Math.cos(a) * 100;
    const y = Math.sin(a) * 100;
    const z = Math.sin(a * 1.3) * 80;
    return { x, y, z };
}

// LAYERS: 3^n
function getLayer(n) {
    return Math.pow(3, n);
}

// FIELD: 540° Winkel
function fieldAngle(t) {
    return (t * DEG_540) % (2 * Math.PI);
}

// RESPO: φ-Mischung
function computeRespo(syn, quant) {
    const raw = (syn + quant) / PHI;
    return Math.min(1, Math.max(0, raw));
}

// SYN & QUANT Dynamik (aus NC.ARCHIEF)
function updateSynQuant(dt) {
    const damp = 0.02;
    const bias = 0.005;

    // SYN und QUANT beeinflussen sich
    if (state.syn > state.quant) {
        state.quant += (state.syn - state.quant) * damp * 0.5;
    } else {
        state.syn += (state.quant - state.syn) * damp * 0.5;
    }

    // Bias
    state.syn += bias * Math.sin(state.t * 0.3);
    state.quant -= bias * Math.cos(state.t * 0.2);

    // Begrenzen
    state.syn = Math.min(1, Math.max(0.05, state.syn));
    state.quant = Math.min(1, Math.max(0.05, state.quant));

    // TARGET: 0.618 (φ⁻¹)
    const target = PHI_INV;
    state.syn += (target - state.syn) * 0.001;
    state.quant += (target - state.quant) * 0.001;

    state.syn = Math.min(1, Math.max(0.05, state.syn));
    state.quant = Math.min(1, Math.max(0.05, state.quant));
}

// ============================================================
// 6. RENDER — GEO · PHYSIK
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 1. GRID (3, 9, 27)
    drawGrid();

    // 2. FIELD (540° Kreis)
    drawField();

    // 3. AXIS (X, Y, Z)
    drawAxis();

    // 4. LAYERS (3, 9, 27)
    drawLayers();

    // 5. RESPO Kern
    drawRespo();

    // 6. SYN/QUANT (NC.ARCHIEF)
    drawSynQuant();

    // Metriken aktualisieren
    document.getElementById('axis-value').textContent = state.axisValue.toFixed(3);
    document.getElementById('layer-value').textContent = state.layerValue.toFixed(3);
    document.getElementById('field-value').textContent = Math.round((state.field / Math.PI) * 180) + '°';
    document.getElementById('respo-value').textContent = state.respo.toFixed(3);

    // Zeit
    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        state.field = fieldAngle(state.t);
        state.fieldValue = state.field / (2 * Math.PI);

        const rot = rotateAxis(state.t * 0.3, 'x');
        state.axis = rot;
        state.axisValue = (Math.abs(rot.x) + Math.abs(rot.y) + Math.abs(rot.z)) / 300;

        state.layer = 1 + Math.floor((state.t * 0.1) % 3);
        state.layerValue = getLayer(state.layer) / 27;

        updateSynQuant(0.016);
        state.respo = computeRespo(state.syn, state.quant);
    }

    // Daten-Update
    if (state.cycle % 15 === 0) {
        document.getElementById('cycle-display').textContent = `φ ${(state.respo * 100).toFixed(0)}%`;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 7. ZEICHEN-FUNKTIONEN
// ============================================================

// 1. GRID
function drawGrid() {
    const sizes = [3, 9, 27];
    const colors = ['#0ff1', '#f0f1', '#ff01'];
    sizes.forEach((size, idx) => {
        const spacing = radius * 0.05 * (27 / size);
        const offset = (size - 1) * spacing / 2;
        ctx.strokeStyle = colors[idx];
        ctx.lineWidth = 0.3;
        for (let i = 0; i < size; i++) {
            const pos = -offset + i * spacing;
            ctx.beginPath();
            ctx.moveTo(cx + pos, cy - offset);
            ctx.lineTo(cx + pos, cy + offset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - offset, cy + pos);
            ctx.lineTo(cx + offset, cy + pos);
            ctx.stroke();
        }
    });
}

// 2. FIELD (540°)
function drawField() {
    const r = radius * 0.85;
    const segments = 60;
    const fieldAngle = state.field;

    // 540° = 3 × 180° = 3 Halbkreise
    for (let i = 0; i < 3; i++) {
        const start = i * DEG_180 + fieldAngle * 0.3;
        const end = start + DEG_180;

        ctx.strokeStyle = `rgba(255, 215, 61, ${0.05 + i * 0.05})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let j = 0; j < segments; j++) {
            const a = start + (end - start) * (j / segments);
            const x = cx + Math.cos(a) * r * (0.7 + i * 0.1);
            const y = cy + Math.sin(a) * r * (0.7 + i * 0.1);
            j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();

        // 540° Label
        ctx.fillStyle = `rgba(255, 215, 61, ${0.1 + i * 0.1})`;
        ctx.font = '7px Consolas';
        ctx.textAlign = 'center';
        const la = start + DEG_90;
        ctx.fillText(`${(i + 1) * 180}°`, cx + Math.cos(la) * r * 0.75, cy + Math.sin(la) * r * 0.75);
    }

    // 540° zentral
    ctx.fillStyle = 'rgba(255, 215, 61, 0.15)';
    ctx.font = '8px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText('540°', cx, cy + radius * 0.55);
}

// 3. AXIS (X, Y, Z)
function drawAxis() {
    const a = state.axis;
    const r = radius * 0.6;

    // X-Achse (rot)
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + a.x * 1.2, cy + a.x * 0.2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 107, 107, 0.6)';
    ctx.font = '8px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText('X', cx + a.x * 1.4, cy + a.x * 0.2 - 10);

    // Y-Achse (grün)
    ctx.strokeStyle = 'rgba(107, 255, 107, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + a.y * 0.2, cy + a.y * 1.2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(107, 255, 107, 0.6)';
    ctx.fillText('Y', cx + a.y * 0.2 - 10, cy + a.y * 1.4);

    // Z-Achse (blau)
    ctx.strokeStyle = 'rgba(107, 107, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + a.z * 0.5, cy - a.z * 0.5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(107, 107, 255, 0.6)';
    ctx.fillText('Z', cx + a.z * 0.7, cy - a.z * 0.7);
}

// 4. LAYERS (3, 9, 27)
function drawLayers() {
    const sizes = [3, 9, 27];
    const colors = ['rgba(255, 107, 107, 0.15)', 'rgba(107, 107, 255, 0.15)', 'rgba(255, 215, 61, 0.15)'];
    const active = state.layer - 1;

    sizes.forEach((size, idx) => {
        const r = radius * (0.2 + idx * 0.25);
        const isActive = idx === active;

        ctx.strokeStyle = isActive ? colors[idx].replace('0.15', '0.5') : colors[idx];
        ctx.lineWidth = isActive ? 2 : 0.5;
        ctx.setLineDash(isActive ? [] : [2, 4]);

        // Kreis
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        // Label
        ctx.fillStyle = isActive ? 'rgba(255,215,61,0.6)' : 'rgba(255,255,255,0.1)';
        ctx.font = isActive ? '9px Consolas' : '7px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText(`${size}²`, cx, cy + r + (isActive ? 16 : 12));

        // Wenn aktiv, Punkte auf dem Kreis
        if (isActive) {
            for (let i = 0; i < size; i++) {
                const a = (i / size) * Math.PI * 2 + state.t * 0.2;
                const px = cx + Math.cos(a) * r;
                const py = cy + Math.sin(a) * r;
                ctx.fillStyle = `rgba(255, 215, 61, ${0.3 + 0.3 * (i / size)})`;
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        ctx.setLineDash([]);
    });
}

// 5. RESPO Kern
function drawRespo() {
    const val = state.respo;
    const coreRadius = 6 + val * 30;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 25);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.2 + val * 0.4})`);
    glow.addColorStop(0.5, `rgba(108, 204, 255, ${0.1 + val * 0.2})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 25, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.7 + val * 0.3})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.4 + val * 0.4})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.2 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 15 + val * 25;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${8 + val * 8}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy);

    ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + val * 0.4})`;
    ctx.font = '7px Consolas';
    ctx.fillText(`φ = ${state.respo.toFixed(3)}`, cx, cy + coreRadius + 14);
}

// 6. SYN/QUANT (NC.ARCHIEF)
function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.25;

    // SYN (rot) links
    const synAngle = syn * Math.PI * 2 + state.t * 0.5;
    const sx = cx - r * 0.8 + Math.cos(synAngle) * r * 0.4;
    const sy = cy + Math.sin(synAngle) * r * 0.4;

    ctx.fillStyle = `rgba(255, 107, 107, ${0.3 + syn * 0.5})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 10 + syn * 15;
    ctx.beginPath();
    ctx.arc(sx, sy, 4 + syn * 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.4 + syn * 0.4})`;
    ctx.font = '6px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 14);

    // QUANT (blau) rechts
    const quantAngle = quant * Math.PI * 2 + state.t * 0.7;
    const qx = cx + r * 0.8 + Math.cos(quantAngle) * r * 0.4;
    const qy = cy + Math.sin(quantAngle) * r * 0.4;

    ctx.fillStyle = `rgba(107, 107, 255, ${0.3 + quant * 0.5})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 10 + quant * 15;
    ctx.beginPath();
    ctx.arc(qx, qy, 4 + quant * 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.4 + quant * 0.4})`;
    ctx.font = '6px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 14);

    // Ziel-Linie (φ⁻¹ = 0.618)
    const target = PHI_INV;
    const targetAngle = target * Math.PI * 2;
    const tx = cx + Math.cos(targetAngle) * r * 1.0;
    const ty = cy + Math.sin(targetAngle) * r * 1.0;

    ctx.strokeStyle = 'rgba(255, 215, 61, 0.15)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255, 215, 61, 0.3)';
    ctx.font = '6px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`φ⁻¹ = 0.618`, tx, ty - 10);
}

// ============================================================
// 8. CONTROLS
// ============================================================
document.getElementById('btn-start').addEventListener('click', function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ MATRYRER gestartet' : '⏸ MATRYRER gestoppt', 'val');
});

document.getElementById('btn-axis').addEventListener('click', function() {
    state.axisValue = Math.min(1, state.axisValue + 0.1);
    log(`⟳ AXIS = ${state.axisValue.toFixed(2)}`, 'axis');
});

document.getElementById('btn-layer').addEventListener('click', function() {
    state.layer = (state.layer % 3) + 1;
    state.layerValue = getLayer(state.layer) / 27;
    log(`△ LAYER = ${state.layer} (${getLayer(state.layer)})`, 'layer');
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    state.axisValue = 0;
    state.layerValue = 0;
    state.field = 0;
    state.layer = 1;
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'φ 0';
    document.getElementById('axis-value').textContent = '0.000';
    document.getElementById('layer-value').textContent = '0.000';
    document.getElementById('field-value').textContent = '0°';
    document.getElementById('respo-value').textContent = '0.000';
    log('⟲ RESET — MATRYRER zurückgesetzt', 'val');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO — MATRYRER atmet', 'val');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `φ ${(state.respo * 100).toFixed(0)}%`;
            log(`🔄 Zyklus ${state.cycle}: AXIS=${state.axisValue.toFixed(2)} LAYER=${state.layer} RESPO=${state.respo.toFixed(3)}`, 'val');
        }, 3000);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'val');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

// ============================================================
// 9. TASTATUR
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-axis').click();
    if (e.key === 'l' || e.key === 'L') document.getElementById('btn-layer').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'z' || e.key === 'Z') document.getElementById('btn-auto').click();
});

// 10. UHR
// ============================================================
function updateClock() {
    document.getElementById('clock').textContent = '⏱️ ' + new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();
