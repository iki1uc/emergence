<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERLAGE · EVO · UFO.js · ERWEITERTE SCHRAUBEN</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --axis: #ff6b6b;
    --layer: #6b6bff;
    --field: #ffd93d;
    --ufo: #ff44ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 4px;
    padding: 8px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
}
header h1 .ufo { color: var(--ufo); }
header h1 .evo { color: var(--field); }
#info-bar { font-size: 8px; color: #666; display: flex; gap: 6px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 4px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    display: block;
}

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    max-height: 100%;
    font-size: 8px;
}
#panel h3 { font-size: 8px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 2px; }

/* ===== SCHRAUBEN ===== */
.screw-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
}
.screw {
    display: flex;
    flex-direction: column;
    gap: 0px;
    background: #0e0e1a;
    border-radius: 3px;
    padding: 2px 4px;
    border: 1px solid #1a1a2a;
}
.screw label {
    color: #666;
    font-size: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.screw input[type="range"] {
    width: 100%;
    height: 3px;
    background: #1a1a2a;
    border-radius: 2px;
    -webkit-appearance: none;
}
.screw input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
}
.screw .val {
    color: var(--gold);
    font-size: 7px;
    font-weight: bold;
    text-align: right;
}
.screw .val.syn { color: var(--axis); }
.screw .val.quant { color: var(--layer); }
.screw .val.ufo { color: var(--ufo); }

/* ===== LOG ===== */
#log {
    flex: 1;
    overflow-y: auto;
    font-size: 7px;
    color: #6a6a8a;
    line-height: 1.2;
    min-height: 30px;
    max-height: 60px;
    background: #06060a;
    border-radius: 3px;
    padding: 2px 4px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.ufo { color: var(--ufo); }
#log .msg.evo { color: var(--field); }
#log .msg.ok { color: #4f4; }

/* ===== METRIKEN ===== */
#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 2px 3px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 5px; text-transform: uppercase; }
.metric .value { font-size: 9px; font-weight: bold; }
.metric.ufo .value { color: var(--ufo); }
.metric.evo .value { color: var(--field); }
.metric.syn .value { color: var(--axis); }
.metric.quant .value { color: var(--layer); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 6px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 7px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.ufo { border-color: var(--ufo); color: var(--ufo); }
button.ufo:hover { background: var(--ufo); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 180px; }
    .screw-group { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
    <h1>
        <span class="ufo">🛸 UFO</span>
        <span style="color:#666;">·</span>
        <span class="evo">EVO</span>
        <span style="color:#666;">·</span>
        <span style="color:var(--gold);">SUPERLAGE</span>
        <span style="color:#666;">·</span>
        <span style="color:var(--axis);">SCHRAUBEN</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">EVO 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="ufoCanvas"></canvas>
    </div>

    <div id="panel">
        <h3>🛸 SCHRAUBEN · EVO · UFO.js</h3>

        <div id="metrics">
            <div class="metric syn"><div class="label">SYN</div><div class="value" id="syn-value">0.00</div></div>
            <div class="metric quant"><div class="label">QUANT</div><div class="value" id="quant-value">0.00</div></div>
            <div class="metric evo"><div class="label">EVO</div><div class="value" id="evo-value">0.00</div></div>
            <div class="metric ufo"><div class="label">UFO</div><div class="value" id="ufo-value">0°</div></div>
        </div>

        <!-- SCHRAUBEN -->
        <div class="screw-group">
            <div class="screw">
                <label>SYN · Ursache</label>
                <input type="range" id="screw-syn" min="0" max="1" step="0.01" value="0.5">
                <span class="val syn" id="screw-syn-val">0.50</span>
            </div>
            <div class="screw">
                <label>QUANT · Wirkung</label>
                <input type="range" id="screw-quant" min="0" max="1" step="0.01" value="0.5">
                <span class="val quant" id="screw-quant-val">0.50</span>
            </div>
            <div class="screw">
                <label>Dämpfung · damp</label>
                <input type="range" id="screw-damp" min="0.1" max="2" step="0.01" value="0.618">
                <span class="val" id="screw-damp-val">0.62</span>
            </div>
            <div class="screw">
                <label>Steifigkeit · stiff</label>
                <input type="range" id="screw-stiff" min="0.1" max="4" step="0.05" value="1.0">
                <span class="val" id="screw-stiff-val">1.00</span>
            </div>
            <div class="screw">
                <label>EVO-Gradient</label>
                <input type="range" id="screw-evo" min="-1" max="1" step="0.01" value="0.0">
                <span class="val ufo" id="screw-evo-val">0.00</span>
            </div>
            <div class="screw">
                <label>UFO · 540° Speed</label>
                <input type="range" id="screw-speed" min="0.1" max="3" step="0.05" value="1.0">
                <span class="val ufo" id="screw-speed-val">1.00</span>
            </div>
            <div class="screw">
                <label>φ-Basis</label>
                <input type="range" id="screw-phi" min="1.4" max="1.8" step="0.001" value="1.618">
                <span class="val" id="screw-phi-val">1.618</span>
            </div>
            <div class="screw">
                <label>Ziel · target</label>
                <input type="range" id="screw-target" min="0.4" max="0.8" step="0.001" value="0.618">
                <span class="val" id="screw-target-val">0.618</span>
            </div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg evo">◈ UFO.js · EVO · Schrauben</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ufo">🛸 540° · φ = 1.618</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="ufo" id="btn-ufo">🛸 UFO</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. KONSTANTEN — UFO.js · EVO
// ============================================================
const PHI = 1.61803398875;
const PHI_INV = 1 / PHI;
const DEG_540 = 3 * Math.PI;

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('ufoCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. UFO.js · EVO-STATE
// ============================================================
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,

    // SYN/QUANT (NC.ARCHIEF)
    syn: 0.5,
    quant: 0.5,
    target: 0.618,

    // Schrauben
    damp: 0.618,
    stiff: 1.0,
    evoGradient: 0.0,
    speed: 1.0,
    phi: 1.618,

    // UFO
    ufoRotation: 0,
    ufoPulse: 0.5,
    ufoScale: 0.8,

    // EVO
    evoPhase: 0,
    evoMode: 'stabil',

    // RESPO
    respo: 0.5
};

// ============================================================
// 4. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'ufo' ? 'ufo' : type === 'evo' ? 'evo' : type === 'ok' ? 'ok' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 5. UFO.js · EVO-KERN
// ============================================================

// NC.ARCHIEF – SYN/QUANT-Dynamik
function updateSynQuant(dt) {
    const diff = state.syn - state.quant;

    // Dämpfung (NC.ARCHIEF)
    if (state.syn > state.quant) {
        state.quant += diff * state.damp * dt * 0.3;
    } else {
        state.syn += Math.abs(diff) * state.damp * dt * 0.3;
    }

    // Steifigkeit (zieht zum Ziel)
    const target = state.target;
    state.syn += (target - state.syn) * state.stiff * dt * 0.02;
    state.quant += (target - state.quant) * state.stiff * dt * 0.02;

    // EVO-Gradient (manuell)
    state.syn += state.evoGradient * dt * 0.1;
    state.quant -= state.evoGradient * dt * 0.1;

    // Begrenzen
    state.syn = Math.min(1, Math.max(0.05, state.syn));
    state.quant = Math.min(1, Math.max(0.05, state.quant));
}

// RESPO = (SYN + QUANT) / φ
function computeRespo() {
    return Math.min(1, (state.syn + state.quant) / state.phi);
}

// EVO-Grad – UFO-Evolution
function updateEVO(dt) {
    const respo = state.respo;
    const diff = state.syn - state.quant;

    // EVO-Phase
    state.evoPhase += (respo * 0.5 + 0.5) * dt * 0.3 * state.speed;

    // UFO-Puls
    state.ufoPulse = 0.5 + 0.5 * Math.sin(state.evoPhase + diff * 0.5);

    // UFO-Skalierung
    state.ufoScale = 0.6 + respo * 0.4;

    // EVO-Modus
    if (diff > 0.15) state.evoMode = 'expand';
    else if (diff < -0.15) state.evoMode = 'contract';
    else state.evoMode = 'stabil';

    // UFO-Rotation (540°)
    state.ufoRotation += dt * 0.5 * state.speed;
}

// ============================================================
// 6. RENDER — UFO · EVO
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 1. GRID (3, 9, 27)
    drawGrid();

    // 2. UFO · 540° (EVO-angepasst)
    drawUFO();

    // 3. SYN/QUANT (NC.ARCHIEF)
    drawSynQuant();

    // 4. RESPO Kern
    drawRespo();

    // 5. EVO-Status
    drawEVOStatus();

    // Metriken
    document.getElementById('syn-value').textContent = state.syn.toFixed(3);
    document.getElementById('quant-value').textContent = state.quant.toFixed(3);
    document.getElementById('evo-value').textContent = state.evoGradient.toFixed(3);
    document.getElementById('ufo-value').textContent = Math.round((state.ufoRotation * 180 / Math.PI) % 540) + '°';

    // Update
    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        const dt = 0.016;
        updateSynQuant(dt);
        state.respo = computeRespo();
        updateEVO(dt);
    }

    if (state.cycle % 15 === 0) {
        document.getElementById('cycle-display').textContent = `EVO ${state.evoMode}`;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 7. ZEICHEN-FUNKTIONEN
// ============================================================

function drawGrid() {
    const sizes = [3, 9, 27];
    const colors = ['#0ff1', '#f0f1', '#ff01'];
    sizes.forEach((size, idx) => {
        const spacing = radius * 0.04 * (27 / size);
        const offset = (size - 1) * spacing / 2;
        ctx.strokeStyle = colors[idx];
        ctx.lineWidth = 0.3;
        for (let i = 0; i < size; i++) {
            const pos = -offset + i * spacing;
            ctx.beginPath();
            ctx.moveTo(cx + pos, cy - offset);
            ctx.lineTo(cx + pos, cy + offset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - offset, cy + pos);
            ctx.lineTo(cx + offset, cy + pos);
            ctx.stroke();
        }
    });
}

function drawUFO() {
    const rot = state.ufoRotation;
    const scale = state.ufoScale;
    const pulse = state.ufoPulse;
    const r = radius * 0.55 * scale;

    // 540° = 3 × 180°
    for (let i = 0; i < 3; i++) {
        const start = i * Math.PI + rot * 0.3;
        const end = start + Math.PI;

        ctx.strokeStyle = `rgba(255, 68, 255, ${0.05 + pulse * 0.15 + i * 0.03})`;
        ctx.lineWidth = 0.8 + pulse * 0.8;
        ctx.beginPath();
        for (let j = 0; j < 50; j++) {
            const a = start + (end - start) * (j / 50);
            const x = cx + Math.cos(a) * r * (0.6 + i * 0.15 + pulse * 0.05);
            const y = cy + Math.sin(a) * r * (0.6 + i * 0.15 + pulse * 0.05);
            j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // UFO-Pulse Punkte
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + rot * 0.5;
        const dist = r * (0.7 + pulse * 0.2);
        const px = cx + Math.cos(a) * dist;
        const py = cy + Math.sin(a) * dist;
        const size = 1.5 + pulse * 2 + Math.sin(a + rot) * 1;

        ctx.fillStyle = `rgba(255, 215, 61, ${0.2 + pulse * 0.3 + 0.2 * (0.5 + 0.5 * Math.sin(a + rot))})`;
        ctx.shadowColor = '#ff44ff';
        ctx.shadowBlur = 4 + pulse * 10;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // UFO Kern
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20 * scale);
    glow.addColorStop(0, `rgba(255, 215, 61, ${0.2 + pulse * 0.3})`);
    glow.addColorStop(1, 'rgba(255, 215, 61, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, 20 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255, 215, 61, ${0.3 + pulse * 0.4})`;
    ctx.font = `${10 * scale}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🛸', cx, cy);

    // 540° Label
    ctx.fillStyle = `rgba(255, 68, 255, ${0.2 + pulse * 0.2})`;
    ctx.font = '7px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText('540°', cx, cy + 18 * scale);
}

function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.2;

    // SYN (rot) links
    const sa = syn * Math.PI * 2 + state.t * 0.2;
    const sx = cx - r * 0.6 + Math.cos(sa) * r * 0.35;
    const sy = cy + Math.sin(sa) * r * 0.35;

    ctx.fillStyle = `rgba(255, 107, 107, ${0.2 + syn * 0.4})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 4 + syn * 10;
    ctx.beginPath();
    ctx.arc(sx, sy, 2 + syn * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.2 + syn * 0.3})`;
    ctx.font = '6px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 10);

    // QUANT (blau) rechts
    const qa = quant * Math.PI * 2 + state.t * 0.3;
    const qx = cx + r * 0.6 + Math.cos(qa) * r * 0.35;
    const qy = cy + Math.sin(qa) * r * 0.35;

    ctx.fillStyle = `rgba(107, 107, 255, ${0.2 + quant * 0.4})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 4 + quant * 10;
    ctx.beginPath();
    ctx.arc(qx, qy, 2 + quant * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.2 + quant * 0.3})`;
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 10);

    // Ziel (0.618)
    const target = state.target;
    const ta = target * Math.PI * 2;
    const tx = cx + Math.cos(ta) * r * 0.9;
    const ty = cy + Math.sin(ta) * r * 0.9;

    ctx.strokeStyle = 'rgba(255, 215, 61, 0.1)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255, 215, 61, 0.2)';
    ctx.font = '5px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`φ⁻¹ = ${state.target.toFixed(3)}`, tx, ty - 8);
}

function drawRespo() {
    const val = state.respo;
    const coreRadius = 3 + val * 18;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 18);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.15 + val * 0.3})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 18, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.5 + val * 0.4})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.3 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.2 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 10 + val * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${5 + val * 6}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy);

    ctx.fillStyle = `rgba(255, 255, 255, ${0.15 + val * 0.3})`;
    ctx.font = '5px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(`φ = ${state.respo.toFixed(3)}`, cx, cy + coreRadius + 4);
}

function drawEVOStatus() {
    const mode = state.evoMode;
    const colors = {
        expand: '#ff6b6b',
        contract: '#6b6bff',
        stabil: '#ffd93d'
    };

    ctx.fillStyle = `rgba(255, 255, 255, 0.04)`;
    ctx.fillRect(8, 8, 80, 16);

    ctx.fillStyle = colors[mode] || '#666';
    ctx.font = '6px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`EVO: ${mode.toUpperCase()}`, 12, 10);

    // EVO-Gradient als Balken
    const gradVal = state.evoGradient;
    const barX = 12, barY = 22, barW = 60, barH = 4;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(barX, barY, barW, barH);
    const fillW = (gradVal + 1) / 2 * barW;
    ctx.fillStyle = gradVal > 0 ? '#ff6b6b' : '#6b6bff';
    ctx.fillRect(barX, barY, Math.max(0, Math.min(barW, fillW)), barH);
}

document.getElementById('btn-start').addEventListener('click', function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ UFO · EVO gestartet' : '⏸ UFO · EVO gestoppt', 'ok');
});

document.getElementById('btn-ufo').addEventListener('click', function() {
    state.ufoRotation += 0.5;
    log(`🛸 UFO manuell gedreht → ${Math.round((state.ufoRotation * 180 / Math.PI) % 540)}°`, 'ufo');
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    state.ufoRotation = 0;
    state.evoPhase = 0;
    state.evoGradient = 0;
    state.evoMode = 'stabil';
    state.ufoPulse = 0.5;
    document.getElementById('screw-syn').value = 0.5;
    document.getElementById('screw-quant').value = 0.5;
    document.getElementById('screw-evo').value = 0;
    document.getElementById('screw-syn-val').textContent = '0.50';
    document.getElementById('screw-quant-val').textContent = '0.50';
    document.getElementById('screw-evo-val').textContent = '0.00';
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'EVO 0';
    document.getElementById('syn-value').textContent = '0.500';
    document.getElementById('quant-value').textContent = '0.500';
    document.getElementById('evo-value').textContent = '0.000';
    document.getElementById('ufo-value').textContent = '0°';
    log('⟲ RESET — UFO · EVO zurückgesetzt', 'ok');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO · UFO · EVO atmet', 'ufo');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `EVO ${state.evoMode}`;
            log(`🔄 Zyklus ${state.cycle}: EVO=${state.evoMode} RESPO=${state.respo.toFixed(3)}`, 'evo');
        }, 3000);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'ok');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 'u' || e.key === 'U') document.getElementById('btn-ufo').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-auto').click();
});
